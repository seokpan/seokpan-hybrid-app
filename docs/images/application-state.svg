<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="454" viewBox="0 0 1000 454" role="img" aria-labelledby="title desc"><title id="title">애플리케이션 요청과 상태</title><desc id="desc">React는 HTTP API로 조회와 상태 변경을 요청하고 WebSocket으로 상태 갱신을 받는다. FastAPI 두 Replica는 MariaDB 영속 데이터와 Redis 실행 중 상태를 공유한다.</desc><rect width="1000" height="454" rx="16" fill="#f8fafc"/><text x="32" y="44" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="27" font-weight="700" fill="#17253b">애플리케이션 요청과 상태</text><text x="32" y="74" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#4b5e78">화면 · API 처리 · 공유 저장소</text><rect x="32" y="100" width="936" height="69" rx="10" fill="#edf2ff" stroke="#b8c7e3"/><text x="52" y="129" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#4865a0">01  화면</text><text x="240" y="140" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="23" font-weight="700" fill="#163b76">브라우저 · React</text><rect x="32" y="183" width="936" height="143" rx="10" fill="#fff" stroke="#b8c7e3"/><text x="52" y="213" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#4865a0">02  API 처리</text><text x="240" y="214" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#163b76">FastAPI · Backend 2개 Replica</text><rect x="240" y="229" width="345" height="79" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/><text x="258" y="261" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#163b76">HTTP  /api/v1</text><text x="258" y="291" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#263a54">조회 · 상태 변경 · 검증</text><rect x="601" y="229" width="345" height="79" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/><text x="619" y="261" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#163b76">WebSocket  /ws/v1</text><text x="619" y="291" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#263a54">Snapshot · Event 전달</text><text x="52" y="360" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#4865a0">03  공유 저장소</text><rect x="240" y="341" width="345" height="87" rx="10" fill="#ecf8f4" stroke="#cbd5e1"/><text x="258" y="373" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#086b62">MariaDB · 영속 데이터</text><text x="258" y="403" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#263a54">회원 · 착수 · 결과 · 레이팅</text><rect x="601" y="341" width="345" height="87" rx="10" fill="#fff6ea" stroke="#cbd5e1"/><text x="619" y="373" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#946018">Redis · 실행 중 상태</text><text x="619" y="403" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#263a54">세션 · 방 · 투표 · 접속</text></svg>