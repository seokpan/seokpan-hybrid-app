# 작성자: 최유준 / 작성 날짜: 2026-09-04 (v2 - PR #48 확정 스펙 반영)
#
# [참고] nginx-unprivileged 공식 이미지는 이미 PID/client_body_temp_path 등을
# /tmp 하위로 구성해 readOnlyRootFilesystem 환경에서 기동 가능하도록 설계되어 있음
# (base nginx.conf, 이 파일은 conf.d/default.conf만 override). 별도 조정 불필요.
#
# [정정] Health 경로를 /health(v1, 임의)에서 /health/live(팀 확정)로 변경.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA Fallback (팀 확정)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /assets 장기 Cache + immutable (팀 확정)
    # Vite 빌드 산출물은 기본적으로 파일명에 content hash가 포함되므로
    # 안전하게 장기 캐시 가능
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html은 재검증 Cache 적용 (팀 확정) - 배포 시마다 최신 반영 필요
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /health/live {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
