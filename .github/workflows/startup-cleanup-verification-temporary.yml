name: Startup cleanup regression verification
on:
  push:
    branches: [fix/b-startup-runner-cleanup-20261007]
    paths: [.github/workflows/startup-cleanup-verification-temporary.yml]
permissions:
  contents: read
concurrency:
  group: b-startup-cleanup-20261007
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.repository == 'seokpan/seokpan-hybrid-app' && github.actor == 'tjung03' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned interpreter and dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/startup-checks"
          python3 -m venv "$RUNNER_TEMP/uv-tool"
          "$RUNNER_TEMP/uv-tool/bin/pip" install --disable-pip-version-check uv==0.12.5
          "$RUNNER_TEMP/uv-tool/bin/uv" python install 3.13.15
          echo "$RUNNER_TEMP/uv-tool/bin" >> "$GITHUB_PATH"
          cd backend
          "$RUNNER_TEMP/uv-tool/bin/uv" sync --locked
      - name: Require the baseline failure and corrected success
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected={'backend/src/seokpan/production_app.py':'b61966fc23ea37da5b283f4e2ff744d65e99e3dfa1b942256074a5be40215942','backend/tests/unit/test_production_startup_cleanup.py':'6c0386244fda609160508c09072207a545914b46a776c0fdb7cb831a38f7cc30'}
          for name,digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          PY
          source_file=backend/src/seokpan/production_app.py
          cp "$source_file" "$RUNNER_TEMP/production-fixed.py"
          trap 'cp "$RUNNER_TEMP/production-fixed.py" "$source_file"' EXIT
          git show bdaa9dfa0a09e5d8efb1714ccf62860315b1346e:"$source_file" > "$source_file"
          set +e
          (cd backend && uv run --no-sync pytest tests/unit/test_production_startup_cleanup.py --junitxml="$RUNNER_TEMP/startup-checks/before.xml" -q) > "$RUNNER_TEMP/startup-checks/before.log" 2>&1
          before_status=$?
          set -e
          test "$before_status" -eq 1
          cp "$RUNNER_TEMP/production-fixed.py" "$source_file"
          trap - EXIT
          python3 - <<'PY'
          from pathlib import Path
          import os,xml.etree.ElementTree as ET
          tree=ET.parse(Path(os.environ['RUNNER_TEMP'])/'startup-checks/before.xml')
          cases=tree.findall('.//testcase')
          assert len(cases)==2
          assert len(tree.findall('.//failure'))==1
          assert not tree.findall('.//error') and not tree.findall('.//skipped')
          failed=[c for c in cases if c.find('failure') is not None]
          assert len(failed)==1 and '[True]' in failed[0].get('name','')
          assert 'startup must not leave a task using closed providers' in ''.join(failed[0].find('failure').itertext())
          PY
          (cd backend && uv run --no-sync pytest tests/unit/test_production_startup_cleanup.py --junitxml="$RUNNER_TEMP/startup-checks/after.xml" -q) 2>&1 | tee "$RUNNER_TEMP/startup-checks/after.log"
          git diff --exit-code
      - name: Run the existing full Backend CI entry point
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          uv run --python 3.13.15 --no-project python scripts/verify_ci.py --run-id "startup-${GITHUB_RUN_ID}" --uv "$(command -v uv)" 2>&1 | tee "$RUNNER_TEMP/startup-checks/verify-ci.log"
          git diff --exit-code
      - name: Preserve scoped verification reports and reviewed bytes
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/startup-checks"
          git rev-parse HEAD > "$RUNNER_TEMP/startup-checks/source-sha.txt"
          if test -d "backend/test-results/startup-${GITHUB_RUN_ID}"; then cp -a "backend/test-results/startup-${GITHUB_RUN_ID}" "$RUNNER_TEMP/startup-checks/reports"; fi
          if test -d "test-results/startup-${GITHUB_RUN_ID}"; then cp -a "test-results/startup-${GITHUB_RUN_ID}" "$RUNNER_TEMP/startup-checks/root-reports"; fi
          cp backend/src/seokpan/production_app.py "$RUNNER_TEMP/startup-checks/production_app.py"
          cp backend/tests/unit/test_production_startup_cleanup.py "$RUNNER_TEMP/startup-checks/test_production_startup_cleanup.py"
          printf '%s\n' 'Synthetic Source regression only; no operational DB, Valkey, cluster or Cloud acceptance.' > "$RUNNER_TEMP/startup-checks/SCOPE.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: startup-cleanup-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/startup-checks
          retention-days: 14
          if-no-files-found: error
