name: Reviewed documentation resume
on:
  push:
    branches: [docs/b-valkey-contract-20261007]
    paths: [.github/workflows/reviewed-resume-temporary.yml]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: reviewed-documentation-resume
  cancel-in-progress: false
jobs:
  apply:
    if: ${{ github.repository == 'seokpan/seokpan-hybrid-app' && github.actor == 'tjung03' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify pinned maintenance source and reviewed preimages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          curl --fail --silent --show-error --location --retry 2 https://raw.githubusercontent.com/seokpan/seokpan-hybrid-docs/a98b14a509078c34581b93dae7d8fb12f02d1684/.github/maintenance/apply-reviewed-resume.py -o "$RUNNER_TEMP/reviewed-maintenance.py"
          test "$(git hash-object "$RUNNER_TEMP/reviewed-maintenance.py")" = e06ac3181d83131c2cc986c0ad58bb3e8ae39d0d
          python3 "$RUNNER_TEMP/reviewed-maintenance.py"
          git -c core.whitespace=-blank-at-eol,blank-at-eof,space-before-tab diff --check
          git diff --binary > "$RUNNER_TEMP/reviewed-resume-report/reviewed.patch"
      - name: Commit reviewed files and remove temporary inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          p=json.load(open('.github/maintenance/reviewed-input.json'))
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==set(p['files']),changed
          subprocess.run(['git','add','--',*p['files']],check=True)
          PY
          git rm .github/maintenance/reviewed-input.json .github/workflows/reviewed-resume-temporary.yml
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author='tjung03 <73955817+tjung03@users.noreply.github.com>' -m 'docs: align Valkey connection contract and preserve historical validation scope'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > "$RUNNER_TEMP/reviewed-resume-report/published-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: reviewed-resume-${{ github.run_id }}
          path: ${{ runner.temp }}/reviewed-resume-report
          if-no-files-found: error
          retention-days: 14
