name: Final B body wording
on:
  push:
    branches: [docs/b-valkey-contract-20261007]
    paths: [.github/workflows/body-cleanup-temporary.yml]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  correct:
    if: ${{ github.actor == 'tjung03' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {ref: '${{ github.sha }}'}
      - name: Correct reviewed B body and verify exact readback
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/maintenance
          cat > .github/maintenance/reviewed-input.json <<'JSON'
          {"schema_version":1,"repository":"seokpan/seokpan-hybrid-app","files":{},"metadata":[{"endpoint":"issues/4","before_sha256":"e35f5c0a0ab1114b1db11cfb38494f35e884a1e4de705db24b1d1db5679c1d75","after_sha256":"f5b3d38cf265b895d169d0de67dcf512e8497a036641504ba267040545f5387f","edits":[[128,129,"**기여 기록:** 실제 독립 예행·기록 Codex. 기존 사전 점검의 수행자 김상희 기록은 그대로 보존합니다. C의 Data 배정/보관 책임은 유지하며 C/B 영역 리뷰와 D Index 검토·수신은 미확인입니다. 팀원이 이 두 Run을 수행·리뷰·수신한 것으로 기록하지 않습니다. 정태훈 또는 승인된 다른 실행자도 권한·대상·공유 실행을 확인한 환경에서 C 기술 측정을 수행할 수 있습니다.\n"]]}]}
          JSON
          curl -fsSL --retry 2 https://raw.githubusercontent.com/seokpan/seokpan-hybrid-docs/a98b14a509078c34581b93dae7d8fb12f02d1684/.github/maintenance/apply-reviewed-resume.py -o "$RUNNER_TEMP/helper.py"
          test "$(git hash-object "$RUNNER_TEMP/helper.py")" = e06ac3181d83131c2cc986c0ad58bb3e8ae39d0d
          python3 "$RUNNER_TEMP/helper.py"
          rm .github/maintenance/reviewed-input.json
          git diff --exit-code
          git rm .github/workflows/body-cleanup-temporary.yml
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author='tjung03 <73955817+tjung03@users.noreply.github.com>' -m 'docs: finish objective B body wording and remove temporary workflow'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > "$RUNNER_TEMP/reviewed-resume-report/published-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: body-wording-${{ github.run_id }}
          path: ${{ runner.temp }}/reviewed-resume-report
          retention-days: 14
